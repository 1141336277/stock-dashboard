name: 自动更新股票数据

on:
  schedule:
    # 交易时间每30分钟更新（北京时间 9:30-15:00，UTC 1:30-7:00）
    - cron: '0,30 1-7 * * 1-5'
    # 盘后也更新一次
    - cron: '0 8 * * 1-5'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 抓取股票数据
        run: node update-stock.js
      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stock.json
          git diff --staged --quiet || git commit -m "更新股票数据 $(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M')"
          git push
