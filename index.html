<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>股市行情 - 陈浩南</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#0f1117;color:#e0e0e0;max-width:600px;margin:0 auto;min-height:100vh}
/* 顶部 */
.header{background:#161a24;padding:20px 16px 12px;text-align:center;border-bottom:1px solid #1e2230;position:sticky;top:0;z-index:10}
.header h1{font-size:20px;font-weight:800;margin-bottom:4px}
.header .sub{font-size:11px;color:#666}
.header .status{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ff3b30;margin-right:4px;animation:pulse 2s infinite}
.header .status.live{background:#34c759}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
/* 指数卡片 */
.index-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 14px}
.index-card{background:#161a24;border-radius:12px;padding:14px;border:1px solid #1e2230}
.index-card .idx-name{font-size:12px;color:#888;margin-bottom:4px}
.index-card .idx-price{font-size:22px;font-weight:700}
.index-card .idx-change{font-size:13px;margin-top:2px}
.index-card .idx-detail{font-size:10px;color:#555;margin-top:6px;display:flex;gap:12px}
.up{color:#ff3b30}.down{color:#34c759}
.up-bg{background:rgba(255,59,48,0.08)}.down-bg{background:rgba(52,199,89,0.08)}
/* 板块标题 */
.section-title{font-size:14px;font-weight:700;padding:16px 16px 8px;display:flex;align-items:center;gap:6px}
/* 股票列表 */
.stock-list{padding:0 14px 20px}
.stock-row{display:flex;align-items:center;gap:10px;padding:11px 12px;background:#161a24;border-radius:10px;margin-bottom:6px;border:1px solid #1e2230}
.stock-rank{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.rank-1{background:#ff3b30;color:#fff}.rank-2{background:#ff6b4a;color:#fff}.rank-3{background:#ff9500;color:#fff}
.rank-n{background:#1e2230;color:#888}
.stock-info{flex:1;min-width:0}
.stock-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stock-code{font-size:10px;color:#555;margin-top:2px}
.stock-price{text-align:right;font-size:14px;font-weight:600;white-space:nowrap}
.stock-change{text-align:right;font-size:12px;font-weight:500;margin-top:2px;white-space:nowrap}
/* 两栏布局 */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:0}
.two-col .section-title{border-bottom:1px solid #1e2230}
/* 新闻 */
.news-section{padding:0 14px 30px}
.news-card{display:block;padding:12px 14px;background:#161a24;border-radius:10px;margin-bottom:6px;text-decoration:none;color:inherit;border:1px solid #1e2230;transition:all 0.2s}
.news-card:hover{border-color:#333}
.news-card .news-title{font-size:13px;font-weight:500;line-height:1.5;margin-bottom:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.news-card .news-time{font-size:10px;color:#555}
/* 底部 */
.footer{text-align:center;padding:20px;color:#555;font-size:11px;line-height:1.8}
/* 加载 */
.loading{text-align:center;padding:60px 20px;color:#666;font-size:14px}
.spinner{display:inline-block;width:28px;height:28px;border:3px solid #1e2230;border-top-color:#ff3b30;border-radius:50%;animation:spin 0.8s linear infinite;margin-bottom:12px}
@keyframes spin{to{transform:rotate(360deg)}}
/* 两列 */
.cols{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 14px}
@media(max-width:400px){.index-row{grid-template-columns:1fr 1fr}.index-card .idx-price{font-size:18px}}
</style>
</head>
<body>
<div class="header">
  <h1>📈 股市行情</h1>
  <div class="sub"><span class="status" id="status-dot"></span><span id="update-time">加载中...</span> · 陈浩南制作</div>
</div>
<div id="app">
  <div class="loading"><div class="spinner"></div><br>正在加载行情数据...</div>
</div>
<div class="footer">数据来源：新浪财经 | 交易时间自动更新<br>陈浩南 © 2026 · 投资有风险，仅供参考</div>

<script>
var stockData = null;

async function loadData(){
  try{
    var resp = await fetch('stock.json');
    if(!resp.ok) throw new Error('加载失败');
    stockData = await resp.json();
    renderAll();
  }catch(e){
    document.getElementById('app').innerHTML = '<div class="loading">⚠️ 数据加载失败<br><button onclick="loadData()" style="margin-top:12px;padding:8px 20px;border-radius:16px;background:#ff3b30;color:#fff;border:none;cursor:pointer;font-size:13px">点击重试</button></div>';
  }
}

function renderAll(){
  updateHeader();
  var html = '';

  // 指数卡片
  html += '<div class="index-row">';
  (stockData.indices||[]).forEach(function(idx){
    var isUp = idx.change >= 0;
    html += '<div class="index-card '+(isUp?'up-bg':'down-bg')+'">';
    html += '<div class="idx-name">'+esc(idx.name)+'</div>';
    html += '<div class="idx-price '+(isUp?'up':'down')+'">'+fmtPrice(idx.price)+'</div>';
    html += '<div class="idx-change '+(isUp?'up':'down')+'">'+(isUp?'+':'')+idx.change.toFixed(2)+'%</div>';
    html += '<div class="idx-detail"><span>开 '+fmtPrice(idx.open)+'</span><span>高 '+fmtPrice(idx.high)+'</span><span>低 '+fmtPrice(idx.low)+'</span></div>';
    html += '</div>';
  });
  html += '</div>';

  // 涨幅榜 + 跌幅榜（两列）
  html += '<div class="cols"><div>';
  html += '<div class="section-title">🔥 涨幅榜</div>';
  html += '<div class="stock-list">';
  (stockData.gainers||[]).forEach(function(s,i){
    html += stockRow(s,i,true);
  });
  html += '</div></div><div>';
  html += '<div class="section-title">📉 跌幅榜</div>';
  html += '<div class="stock-list">';
  (stockData.losers||[]).forEach(function(s,i){
    html += stockRow(s,i,false);
  });
  html += '</div></div></div>';

  // 股市新闻
  html += '<div class="section-title">📰 财经快讯</div><div class="news-section">';
  (stockData.news||[]).forEach(function(n){
    html += '<a class="news-card" href="'+esc(n.url)+'" target="_blank">';
    html += '<div class="news-title">'+esc(n.title)+'</div>';
    html += '<div class="news-time">'+fmtTime(n.time)+'</div>';
    html += '</a>';
  });
  html += '</div>';

  document.getElementById('app').innerHTML = html;
}

function stockRow(s,i,isGainer){
  var cls = i<3 ? 'rank-'+(i+1) : 'rank-n';
  var isUp = isGainer;
  var changeCls = isUp ? 'up' : 'down';
  return '<div class="stock-row">'+
    '<span class="stock-rank '+cls+'">'+(i+1)+'</span>'+
    '<div class="stock-info"><div class="stock-name">'+esc(s.name)+'</div><div class="stock-code">'+esc(s.code)+'</div></div>'+
    '<div><div class="stock-price">'+fmtPrice(s.price)+'</div><div class="stock-change '+changeCls+'">'+(isUp?'+':'')+s.change.toFixed(2)+'%</div></div>'+
    '</div>';
}

function updateHeader(){
  var d = new Date(stockData.updated);
  var t = (d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  document.getElementById('update-time').textContent = '更新于 '+t;

  // 判断是否交易时间
  var now = new Date();
  var h = now.getHours(), day = now.getDay();
  var isTrading = day>=1 && day<=5 && h>=9 && h<15;
  var dot = document.getElementById('status-dot');
  if(isTrading){ dot.className = 'status live'; dot.title = '交易中'; }
  else { dot.className = 'status'; dot.title = '已收盘'; }
}

function fmtPrice(p){
  if(!p) return '-';
  return p>=100 ? p.toFixed(1) : p>=10 ? p.toFixed(2) : p.toFixed(3);
}

function fmtTime(ts){
  if(!ts) return '';
  try{
    var d = /^\d+$/.test(String(ts)) ? new Date(parseInt(ts)*1000) : new Date(ts);
    if(isNaN(d.getTime())) return '';
    return (d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  }catch(e){return '';}
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

loadData();
</script>
</body>
</html>
